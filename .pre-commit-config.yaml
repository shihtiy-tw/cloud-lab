# Pre-commit Configuration for aws-lab
# https://pre-commit.com/

---
default_stages: [pre-commit]
fail_fast: false

repos:
  # Pre-commit hooks framework
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ["--branch", "main", "--branch", "master"]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Terraform linting and formatting
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.86.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args:
          - --hook-config=--retry-once-with-cleanup=true
      # The four hooks below are on the manual stage for one reason: none of these
      # binaries ships with pre-commit, and when a binary is absent the hook exits
      # 127, which blocks *every* commit touching a .tf file. That is not a
      # security gate, it is an outage -- the same failure infracost had below.
      #
      # This is a real downgrade and worth reversing. Install the tools
      # (`aws/scripts/setup-dev.sh` treats tflint and tfsec as required,
      # terraform-docs and checkov as optional), then either move these back to
      # the default stage or run them deliberately:
      #
      #   pre-commit run --hook-stage manual --all-files
      #   make security CLOUD=aws SERVICE=compute/dev-vm   # the repo's own wrapper
      #
      # Note tfsec is deprecated upstream in favour of terraform_trivy; migrating
      # is the better fix than reinstating tfsec.
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
        stages: [manual]
      - id: terraform_docs
        args:
          - --args=--config=__GIT_WORKING_DIR__/.terraform-docs.yml
        stages: [manual]
      - id: terraform_tfsec
        args:
          - --args=--config-file __GIT_WORKING_DIR__/.tfsec.yml
        stages: [manual]
      - id: terraform_checkov
        args:
          - --args=--config-file __GIT_WORKING_DIR__/.checkov.yml
        stages: [manual]
      # Manual stage on purpose. infracost needs a (paid) API key and a network
      # round-trip to price resources, and aws/scripts/setup-dev.sh already
      # classifies it as an optional tool -- so a missing binary exited 127 and
      # blocked every commit that touched a .tf file. Run it deliberately:
      #   pre-commit run infracost_breakdown --hook-stage manual --all-files
      # or via the repo's own wrapper, `make cost-estimate`.
      - id: infracost_breakdown
        args:
          - --args=--path .
        verbose: true
        stages: [manual]

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]
        # Same reason as shfmt below: .specify/scripts/ is vendored from spec-kit
        # upstream and is not ours to fix. Every shellcheck failure under
        # --all-files came from these files; excluding them makes a repo-wide run
        # meaningful instead of permanently red.
        exclude: ^(aws/)?\.specify/scripts/

  # Shell script formatting
  #
  # -w is load-bearing. Without a write (-w) or diff (-d) flag, shfmt prints the
  # formatted script to stdout and exits 0, so the hook passed unconditionally
  # and never reformatted anything. -w makes it fix files in place; pre-commit
  # then reports "files were modified by this hook" and fails the run.
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.7.0-4
    hooks:
      - id: shfmt
        args: ["-w", "-i", "2", "-ci", "-bn", "-sr"]
        # .specify/scripts/ is vendored from spec-kit upstream. Reformatting it
        # would conflict on every upstream refresh for no benefit, so it is
        # excluded rather than churned.
        exclude: ^(aws/)?\.specify/scripts/

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.33.0
    hooks:
      - id: yamllint
        args: ["-c", ".yamllint", "--strict"]

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        args: ["--config", ".markdownlint.json"]

  # Security scanning
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: '(\.lock|\.sum|\.tfstate)'

  # AWS specific
  #
  # awslabs/git-secrets ships no .pre-commit-hooks.yaml, so it cannot be used as
  # a `repo:` entry. Referencing it raised InvalidManifestError, which aborts the
  # entire pre-commit run rather than just this hook -- no other hook could run.
  # Invoked locally instead, and skipped with a note when not installed.
  - repo: local
    hooks:
      - id: git-secrets
        name: git-secrets scan
        entry: >-
          bash -c 'command -v git-secrets >/dev/null 2>&1 || {
          echo "git-secrets not installed, skipping (https://github.com/awslabs/git-secrets)";
          exit 0; }; exec git secrets --scan "$@"' --
        language: system
        types: [text]

  # Git commit message linting
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.13.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

# CI configuration
ci:
  autofix_prs: true
  autofix_commit_msg: "style: auto-fix by pre-commit.ci"
  autoupdate_branch: "main"
  autoupdate_schedule: weekly
