# terraform-docs Configuration for aws-lab
# https://terraform-docs.io/

---
formatter: markdown table

version: ">= 0.16.0"

header-from: doc.md
footer-from: ""

recursive:
  enabled: true
  path: modules

sections:
  hide: []
  show: []

content: |-
  {{ .Header }}

  ## Overview

  {{ .Description }}

  {{ if .Requirements }}
  ## Requirements

  {{ .Requirements }}
  {{ end }}

  {{ if .Providers }}
  ## Providers

  {{ .Providers }}
  {{ end }}

  {{ if .Modules }}
  ## Modules

  {{ .Modules }}
  {{ end }}

  {{ if .Resources }}
  ## Resources

  {{ .Resources }}
  {{ end }}

  {{ if .Inputs }}
  ## Inputs

  {{ .Inputs }}
  {{ end }}

  {{ if .Outputs }}
  ## Outputs

  {{ .Outputs }}
  {{ end }}

  {{ .Footer }}

output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

output-values:
  enabled: false
  from: ""

sort:
  enabled: true
  by: name

settings:
  anchor: true
  color: true
  default: true
  description: true
  escape: true
  hide-empty: false
  html: true
  indent: 2
  lockfile: true
  read-comments: true
  required: true
  sensitive: true
  type: true
